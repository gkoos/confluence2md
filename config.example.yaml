confluence:
  # Your Atlassian account email
  username: you@example.com
  # Atlassian API token (classic, unrestricted; or scoped/least-privilege)
  # Generate one at: https://id.atlassian.com/manage-profile/security/api-tokens
  token: ""
  # Credential style: auto (default) | classic | scoped
  # - auto: detect automatically. Tries the classic (tenant-domain) endpoint
  #   first; on an authorization failure, resolves the site's cloud ID and
  #   retries against Atlassian's scoped-token gateway. Leave this as auto
  #   unless detection picks the wrong style for your token.
  # - classic: force the classic tenant-domain endpoint (today's behaviour).
  # - scoped: force the scoped-token gateway. Required scopes are documented
  #   in README.md; see also cloud_id below.
  auth_mode: auto
  # Atlassian cloud ID for your site, used only in scoped mode. Leave empty
  # to auto-resolve it from your seed URLs (the tool queries your site's
  # public, unauthenticated /_edge/tenant_info endpoint). Set this only if
  # that automatic resolution is not possible for your site.
  cloud_id: ""

crawl:
  # One or more seed page URLs to start from
  seeds:
    - https://your-org.atlassian.net/wiki/spaces/SPACE/pages/123456/Page+Title
  # Maximum link-follow depth from each seed (0 = seed pages only)
  max_depth: 3
  # Maximum concurrent API requests
  concurrency: 5
  # Requests per minute (Confluence Cloud limit is ~300/min per token)
  rate_limit_rpm: 250
  # Maximum buffered discovered pages waiting to be processed
  queue_size: 10000
  # Also crawl child pages in the Confluence page tree hierarchy, not just
  # pages linked from the page body. Useful when pages exist only as sidebar
  # children with no inline links or macros. Shares max_depth with link traversal.
  follow_children: false

output:
  # Directory to write Markdown files, attachments, and metadata
  dir: ./output

post_crawl_hook:
  # Optional fire-and-forget command run after a successful non-dry-run crawl.
  # Command is argv-style to avoid shell quoting issues.
  # Example: trigger local index refresh after crawl completion.
  # command:
  #   - ./scripts/reindex.sh
  #   - --output
  #   - ./output
  command: []

attachments:
  # Download attachments referenced by crawled pages
  download: true
  # Skip attachments larger than this size in MB (0 = no limit)
  max_size_mb: 100

retry:
  # Maximum number of retries for transient API errors (429, 5xx)
  max_attempts: 5
  # Initial backoff in milliseconds (doubles with each retry + jitter)
  initial_backoff_ms: 1000
